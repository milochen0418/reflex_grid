[tool.poetry]
name = "reflex-grid"
version = "0.1.0"
description = "Open-source online Excel: a browser spreadsheet that opens and saves .xlsx/.xlsm, runs VBA macros and UserForms, and lets people edit together live."
authors = ["Milo Chen"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/milochen0418/reflex_grid"
repository = "https://github.com/milochen0418/reflex_grid"
documentation = "https://github.com/milochen0418/reflex_grid/tree/main/docs"
keywords = ["spreadsheet", "excel", "xlsx", "xlsm", "vba", "macros", "userform", "collaboration", "formula-engine"]
classifiers = [
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
]
packages = [{include = "reflex_grid"}, {include = "gridcore"}]

[tool.poetry.dependencies]
# Developed on 3.15; 3.11 stays allowed for the re_ddns App Store image (python:3.11).
python = ">=3.11,<3.16"
reflex = "0.10.0"
# Sign-in (SSO) and calls through DDNS Intents; the app also runs without it (guests, no calls).
reflex-ddns-auth = {path = "../reflex_ddns_auth", develop = true}
PyJWT = ">=2.8"

[tool.poetry.scripts]
gridcore = "gridcore.cli:main"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
playwright = "^1.42.0"
openpyxl = "^3.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
